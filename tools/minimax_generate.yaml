identity:
  name: minimax_generate_video
  author: acedatacloud
  label:
    en_US: MiniMax H3 Generate Video
    zh_Hans: MiniMax H3 生成视频
description:
  human:
    en_US: Generate MiniMax H3 video from text, images, or audio guidance.
    zh_Hans: 使用文本、图片或音频引导生成 MiniMax H3 视频。
  llm: Generate a 4-15 second MiniMax H3 video at 768P or 2K. Prompt is required;
    audio also requires images. Generation returns a task ID. Query the same task
    until complete; never resubmit a pending generation.
parameters:
- name: model
  type: select
  required: false
  label:
    en_US: Model
    zh_Hans: 模型
  human_description:
    en_US: Select the current API model for this operation.
    zh_Hans: 模型名称，当前仅支持官方值 `MiniMax-H3`。
  llm_description: Select the current API model for this operation.
  form: form
  default: MiniMax-H3
  options:
  - value: MiniMax-H3
    label:
      en_US: MiniMax-H3
      zh_Hans: MiniMax-H3
- name: content
  type: string
  required: true
  label:
    en_US: Content
    zh_Hans: 内容
  human_description:
    en_US: Ordered MiniMax H3 V2 text, image, video, and audio content items. Enter
      a JSON array.
    zh_Hans: 按顺序排列的 MiniMax H3 V2 文本、图片、视频和音频内容项。 请填写 JSON 数组。
  llm_description: Ordered MiniMax H3 V2 text, image, video, and audio content items.
    Enter a JSON array.
  form: form
- name: resolution
  type: select
  required: false
  label:
    en_US: Resolution
    zh_Hans: 分辨率
  human_description:
    en_US: Output resolution.
    zh_Hans: 输出视频分辨率。
  llm_description: Output resolution.
  form: form
  default: 480P
  options:
  - value: 480P
    label:
      en_US: 480P
      zh_Hans: 480P
  - value: 768P
    label:
      en_US: 768P
      zh_Hans: 768P
  - value: 2K
    label:
      en_US: 2K
      zh_Hans: 2K
- name: duration
  type: number
  required: false
  label:
    en_US: Duration
    zh_Hans: 时长
  human_description:
    en_US: Integer duration from 4 to 15 seconds.
    zh_Hans: 4–15 秒整数时长。
  llm_description: Integer duration from 4 to 15 seconds.
  form: form
  default: 4
- name: ratio
  type: select
  required: false
  label:
    en_US: Aspect Ratio
    zh_Hans: 宽高比
  human_description:
    en_US: Output aspect ratio.
    zh_Hans: 输出视频宽高比。
  llm_description: Output aspect ratio.
  form: form
  default: '16:9'
  options:
  - value: adaptive
    label:
      en_US: adaptive
      zh_Hans: adaptive
  - value: '21:9'
    label:
      en_US: '21:9'
      zh_Hans: '21:9'
  - value: '16:9'
    label:
      en_US: '16:9'
      zh_Hans: '16:9'
  - value: '4:3'
    label:
      en_US: '4:3'
      zh_Hans: '4:3'
  - value: '1:1'
    label:
      en_US: '1:1'
      zh_Hans: '1:1'
  - value: '3:4'
    label:
      en_US: '3:4'
      zh_Hans: '3:4'
  - value: '9:16'
    label:
      en_US: '9:16'
      zh_Hans: '9:16'
output_schema:
  type: object
  properties:
    status:
      type: string
    success:
      type: boolean
    task_id:
      type: string
    trace_id:
      type: string
    media_urls:
      type: array
      items:
        type: string
    data: {}
    result:
      type: object
extra:
  python:
    source: tools/minimax_generate.py
